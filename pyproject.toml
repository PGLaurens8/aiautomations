[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiautomations"
version = "0.1.0"
description = "AI-assisted data engineering and analysis automation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aiauto = "aiautomations.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
